<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Portfolio — 김찬영</title>
  <meta name="description" content="토픽별 Unity/C# 코드 포트폴리오. 섬 노이즈, 메시·콜라이더, 아키텍처, 튜토리얼.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="./">Code Portfolio</a>
      <div class="top-actions">
        <a class="back" href="https://cykim0115.github.io/">← 메인 포트폴리오</a>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="테마 전환">
          <span class="icon-moon">☾</span>
          <span class="icon-sun">☀</span>
        </button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="content" id="content">
      <div class="welcome" id="welcome">
        <p class="eyebrow">김찬영 · Unity Client</p>
        <h1>토픽별 코드 쇼케이스</h1>
        <p>
          전체를 덤프하지 않습니다. <strong>한 토픽에 관련된 원문만</strong> 모아 두었습니다.
          왼쪽에서 토픽을 고르면 설명과 소스 파일이 열립니다.
        </p>
      </div>
      <article class="topic-view" id="topic-view" hidden></article>
    </section>
  </main>

  <script src="bundle-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
